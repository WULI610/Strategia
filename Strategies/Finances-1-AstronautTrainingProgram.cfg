// Strategy for increased Kerbal experience.
//   Author: nightingale

STRATEGY_LEVEL_EXPAND:NEEDS[CustomBarnKit]
{
    author = Nightingale
    name = AstronautTrainingProgram
   
    title = #Loc_Strategies_Finances_1_AstronautTrainingProgram_title
    desc = #Loc_Strategies_Finances_1_AstronautTrainingProgram
    department = Finances
    icon = Strategia/icons/AstronautTrainingProgram

    groupTag = AstronautTrainingProgram
    
    minLeastDuration = 600
    maxLeastDuration = 600
    minLongestDuration = 1200
    maxLongestDuration = 1600
    
    requiredReputation
    {
        1 = 225
        2 = 475
        3 = 725
    }
    
    initialCostFunds
    {
        1 = 500000
        2 = 2000000
        3 = 5000000
    }
    initialCostReputation = 0.0
    initialCostScience = 0.0
    
    hasFactorSlider = False
    factorSliderDefault = 0.10
    factorSliderSteps = 3

    EFFECT
    {
        name = NewKerbalExperience

        level
        {
            1 = 1
            2 = 2
            3 = 3
        }
    }

    EFFECT
    {
        name = CurrencyOperationWithPopup
        currency = Funds
        operation = Multiply
        
        effectDescription = #Loc_Strategies_Finances_1_AstronautTrainingProgram_effectDescription_HiringCosts
        
        minValue
        {
            1 = 2.0
            2 = 3.0
            3 = 5.0
        }
        maxValue
        {
            1 = 2.0
            2 = 3.0
            3 = 5.0
        }
        
        AffectReasons = CrewRecruited
    }

    EFFECT
    {
        name = MinimumFacilityLevelRequirement
        level
        {
            1 = 1
            2 = 2
            3 = 3
        }
    }
}
