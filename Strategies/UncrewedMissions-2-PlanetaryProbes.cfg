// Strategy for planetary probes
//   Author: nightingale

STRATEGY_BODY_EXPAND:NEEDS[CustomBarnKit]
{
    author = Nightingale
    name = PlanetaryProgram
    id = PlanetaryProgram

    title = #Loc_Strategies_UncrewedMissions_2_PlanetaryProbes_title
    desc = #Loc_Strategies_UncrewedMissions_2_PlanetaryProbes
    department = Uncrewed Missions
    icon = Strategia/icons/DresProgram
    icon
    {
        Moho = Strategia/icons/MohoProgram
        Eve = Strategia/icons/EveProgram
        Duna = Strategia/icons/DunaProgram
        Eeloo = Strategia/icons/EelooProgram
        Mercury = Strategia/icons/MohoProgram
        Venus = Strategia/icons/EveProgram
        Mars = Strategia/icons/DunaProgram
        Pluto = Strategia/icons/EelooProgram
        Ernus = Strategia/icons/MohoProgram
        Arin = Strategia/icons/MohoProgram
        Lave = Strategia/icons/DunaProgram
        Titanus = Strategia/icons/MunProgram
    }

    groupTag = CelestialBodyProgram,A
    
    minLeastDuration = 600
    maxLeastDuration = 600
    minLongestDuration = 1200
    maxLongestDuration = 1600
    
    requiredReputationMin = 200
    requiredReputationMax = 200
    
    initialCostFunds = 0.0
    initialCostReputation = 0.0
    initialCostScience = 0.0
    
    hasFactorSlider = False
    factorSliderDefault = 0.10
    factorSliderSteps = 1

    EFFECT
    {
        name = IncompatibleGroupRequirement

        group = CelestialBodyProgram
        text = #Loc_Strategies_UncrewedMissions_Incompatible_Text
    }

    EFFECT
    {
        name = CurrencyOperationByBody
        currency = Funds
        operation = Multiply
        
        effectDescription = #Loc_Strategies_UncrewedMissions_2_PlanetaryProbes_effectDescription_Body
        
        minValue = 5.00
        maxValue = 5.00	
        
        AffectReasons = Progression

        includeBody = $body
    }

    EFFECT
    {
        name = CurrencyOperationByBody
        currency = Funds
        operation = Multiply
        
        effectDescription = #Loc_Strategies_UncrewedMissions_2_PlanetaryProbes_effectDescription_OtherBodies
        
        minValue = 0.20
        maxValue = 0.20	
        
        AffectReasons = Progression

        excludeBody = $body
    }

    EFFECT
    {
        name = ContractEffect

        contractType = STG_BodyProbes

        targetBody = $body
        synopsis = #Loc_Strategies_UncrewedMissions_2_PlanetaryProbes_synopsis
        completedMessage = #Loc_Strategies_UncrewedMissions_2_PlanetaryProbes_completedMessage
        failureMessage = #Loc_Strategies_UncrewedMissions_2_PlanetaryProbes_failureMessage

        advanceFunds = 250000.0
        advanceFunds
        {
            Moho = 350000
            Eve = 500000
            Eeloo = 500000
            Mercury = 100000
            Venus = 250000
            Pluto = 500000
            Lave = 500000
            Titanus = 750000
        }
        rewardReputation = 100
        rewardReputation
        {
            Moho = 75
            Eve = 150
            Eeloo = 150
            Mercury = 50
            Venus = 150
            Pluto = 150
            Ernus = 50
            Lave = 150
            Titanus = 200
        }

        rewardFunds = 250000
        rewardFunds
        {
            Moho = 350000
            Eve = 500000
            Eeloo = 500000
            Mercury = 200000
            Venus = 500000
            Pluto = 1000000
            Lave = 500000
            Titanus = 1000000
        }

        failureReputation = 500
        failureFunds = 1500000
    }

    EFFECT
    {
        name = ContractWeightBooster
        
        bodies = $body
        weight = 25
    }

    EFFECT
    {
        name = MinimumFacilityLevelRequirement
        level = 2
    }

    EFFECT
    {
        name = LandedBodyRequirement
        id = MoonProgram
    }

    EFFECT
    {
        name = ReachedBodyMannedRequirement

        invert = true
        body = $body
    }

    EFFECT
    {
        name = LandedBodyRequirement 

        invert = true
        body = $body
    }

    EFFECT
    {
        name = VesselEnrouteRequirement

        invert = true
        body = $body
    }

    EFFECT:NEEDS[ResearchBodies]
    {
        name = ResearchBodiesRequirement
        body = $body
    }
}
