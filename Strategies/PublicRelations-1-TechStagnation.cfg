// Strategy for a low-tech approach.
//   Author: nightingale

STRATEGY_LEVEL_EXPAND:NEEDS[CustomBarnKit]
{
    author = Nightingale
    name = TechStagnation

    title = #Loc_Strategies_PublicRelations_1_TechStagnation_title

    desc = #Loc_Strategies_PublicRelations_1_TechStagnation
    department = Public Relations
    icon = Strategia/icons/TechStagnation

    groupTag = TechStagnation
    
    minLeastDuration = 600
    maxLeastDuration = 600
    minLongestDuration = 1200
    maxLongestDuration = 1600
    
    requiredReputation
    {
        1 = 175
        2 = 425
        3 = 675
    }
    
    initialCostFunds = 0.0
    initialCostReputation = 0.0
    initialCostScience
    {
        1 = 100.0
        2 = 500.0
        3 = 1000.0
    }
    
    hasFactorSlider = False
    factorSliderDefault = 0.10
    factorSliderSteps = 3

    EFFECT
    {
        name = CurrencyOperationPerTech
        currency = Reputation
        
        effectDescription = #Loc_Strategies_PublicRelations_1_TechStagnation_effectDescription_ContractRewards
        
        multiplier = 0.1
        multiplier = 0.2
        multiplier = 0.3
        
        affectReason = ContractReward
    }

    EFFECT
    {
        name = CurrencyOperationWithPopup
        currency = Science
        operation = Multiply
        
        effectDescription = #Loc_Strategies_PublicRelations_1_TechStagnation_effectDescription_ResearchCosts
        
        minValue = 2.00
        maxValue = 2.00
        
        AffectReasons = RnDTechResearch
    }

    EFFECT
    {
        name = MinimumFacilityLevelRequirement
        level
        {
            1 = 1
            2 = 2
            3 = 3
        }
    }
}
