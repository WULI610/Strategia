// Strategy for FREE ICE CREAM.
//   Author: nightingale

STRATEGY_LEVEL_EXPAND:NEEDS[CustomBarnKit]
{
    author = Nightingale
    name = FreeIceCream

    title = #Loc_Strategies_PublicRelations_2_FreeIceCream_title

    desc = #Loc_Strategies_PublicRelations_2_FreeIceCream
    department = Public Relations
    icon = Strategia/icons/FreeIceCream

    groupTag = FreeIceCream
    
    minLeastDuration = 600
    maxLeastDuration = 600
    minLongestDuration = 1200
    maxLongestDuration = 1600
    
    requiredReputation
    {
        1 = -1000
        2 = 250
        3 = 500
    }

    initialCostFunds
    {
        1 = 35000
        2 = 100000
        3 = 300000
    }

    initialCostScience = 0.0
    initialCostReputation = 0.0
    
    hasFactorSlider = False
    factorSliderDefault = 0.10
    factorSliderSteps = 3

    EFFECT
    {
        name = ReputationTicker

        period = 30d

        reputationLimit
        {
            1 = 250
            2 = 500
            3 = 750
        }

        reputation
        {
            1 = 2.5
            2 = 5.0
            3 = 7.5
        }

        funds
        {
            1 = 5000
            2 = 20000
            3 = 75000
        }
    }

    EFFECT
    {
        name = CurrencyOperationByContract

        minLevel = 2

        currency = Funds
        currency = Science
        currency = Reputation

        contractType = RecoverAsset

        effectDescription = #Loc_Strategies_PublicRelations_2_FreeIceCream_effectDescription_Rewards

        multiplier = 2.0
        multiplier = 3.0

        AffectReason = ContractReward
    }

    EFFECT
    {
        name = CurrencyOperationTextOverride
        currency = Funds
        operation = Multiply

        minLevel = 3
        
        description = #Loc_Strategies_PublicRelations_2_FreeIceCream_description
        
        minValue = 0.25
        maxValue = 0.25
        
        AffectReasons = CrewRecruited
    }

    EFFECT
    {
        name = MinimumFacilityLevelRequirement
        level
        {
            1 = 1
            2 = 2
            3 = 3
        }
    }
}
