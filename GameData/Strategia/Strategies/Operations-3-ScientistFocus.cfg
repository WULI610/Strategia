// Strategy for better scientists.
//   Author: nightingale

STRATEGY_LEVEL_EXPAND:NEEDS[CustomBarnKit]
{
    author = Nightingale
    name = ScientistFocus

    title = #Loc_Strategies_Operations_3_ScientistFocus_title

    desc = #Loc_Strategies_Operations_3_ScientistFocus
    department = Operations
    icon = Strategia/icons/ScientistFocus

    groupTag = ScientistFocus
    
    minLeastDuration = 600
    maxLeastDuration = 600
    minLongestDuration = 1200
    maxLongestDuration = 1600
    
    requiredReputation
    {
        1 = 50
        2 = 300
        3 = 550
    }
    
    initialCostFunds
    {
        1 = 35000
        2 = 100000
        3 = 300000
    }
    
    initialCostScience
    {
        1 = 20
        2 = 100
        3 = 250
    }
    
    initialCostReputation = 0.0
    
    hasFactorSlider = False
    factorSliderDefault = 0.10
    factorSliderSteps = 3

    EFFECT
    {
        name = IncompatibleRequirement

        strategy = #Loc_Strategies_Operations_1_PilotFocus_title
    }

    EFFECT
    {
        name = IncompatibleRequirement

        strategy = #Loc_Strategies_Operations_2_EngineerFocus_title
    }

    EFFECT
    {
        name = CurrencyOperationByContract

        currency = Funds
        currency = Science
        currency = Reputation

        contractType = CollectScience

        effectDescription = #Loc_Strategies_Operations_3_ScientistFocus_effectDescription_Rewards

        multiplier = 1.5
        multiplier = 2.0
        multiplier = 3.0

        AffectReason = ContractReward

        trait = Scientist
    }

    EFFECT
    {
        name = LevelBooster

        minLevel = 2
        level
        {
            2 = 1
            3 = 2
        }

        trait = Scientist
    }

    EFFECT
    {
        name = CurrencyOperationByTrait

        minLevel = 3

        currency = Science

        effectDescription = #Loc_Strategies_Operations_3_ScientistFocus_effectDescription_FieldWork

        multiplier = 1.2

        AffectReason = VesselRecovery
        AffectReason = ScienceTransmission

        trait = Scientist
    }

    EFFECT
    {
        name = MinimumFacilityLevelRequirement
        level
        {
            1 = 1
            2 = 2
            3 = 3
        }
    }
}
