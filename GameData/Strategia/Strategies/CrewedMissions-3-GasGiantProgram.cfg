// Strategy for the GasGiant Programs
//   Author: nightingale

STRATEGY_BODY_EXPAND:NEEDS[CustomBarnKit]
{
    author = Nightingale
    name = GasGiantProgram
    id = GasGiantProgram

    title = #Loc_Strategies_CrewedMissions_3_GasGiantProgram_title
    title
    {
        Jupiter = #Loc_Strategies_CrewedMissions_3_GasGiantProgram_title_Jupiter
        Saturn = #Loc_Strategies_CrewedMissions_3_GasGiantProgram_title_Saturn
    }

    desc = #Loc_Strategies_CrewedMissions_3_GasGiantProgram
    department = Crewed Missions
    icon = Strategia/icons/JoolProgram

    groupTag = CelestialBodyProgram,A
    
    minLeastDuration = 600
    maxLeastDuration = 600
    minLongestDuration = 1200
    maxLongestDuration = 1600
    
    requiredReputationMin = 500
    requiredReputationMax = 500

    initialCostFunds = 0.0
    initialCostReputation = 0.0
    initialCostScience = 0.0
    
    hasFactorSlider = False
    factorSliderDefault = 0.10
    factorSliderSteps = 1

    EFFECT
    {
        name = IncompatibleGroupRequirement

        group = CelestialBodyProgram
        text = #Loc_Strategies_CrewedMissions_Incompatible_Text
    }

    EFFECT
    {
        name = CurrencyOperationByBody
        currency = Funds
        operation = Multiply
        
        effectDescription = #Loc_Strategies_CrewedMissions_3_GasGiantProgram_effectDescription_Bodies
        
        minValue = 5.00
        maxValue = 5.00	
        
        AffectReasons = Progression

        includeBody = @bodies
    }

    EFFECT
    {
        name = CurrencyOperationByBody
        currency = Funds
        operation = Multiply
        
        effectDescription = #Loc_Strategies_CrewedMissions_3_GasGiantProgram_effectDescription_OtherBodies
        
        minValue = 0.20
        maxValue = 0.20	
        
        AffectReasons = Progression

        excludeBody = @bodies
    }

    EFFECT
    {
        name = ContractEffect

        contractType = STG_GasGiantProgram

        targetBody = $body
        synopsis = #Loc_Strategies_CrewedMissions_3_GasGiantProgram_synopsis
        completedMessage = #Loc_Strategies_CrewedMissions_3_GasGiantProgram_completedMessage
        failureMessage = #Loc_Strategies_CrewedMissions_3_GasGiantProgram_failureMessage

        advanceFunds = 2500000.0
        rewardReputation = 200
        rewardFunds = 1000000

        failureReputation = 500
        failureFunds = 5000000
    }

    EFFECT
    {
        name = ContractWeightBooster
        
        bodies = @bodies
        weight = 25
    }

    EFFECT
    {
        name = MinimumFacilityLevelRequirement
        level = 3
    }

    EFFECT
    {
        name = ReturnFromSurfaceMannedRequirement
        id = PlanetaryProgram
    }

    EFFECT
    {
        name = ReachedBodyRequirement

        invert = true
        body = $body
    }

    EFFECT
    {
        name = VesselEnrouteRequirement

        invert = true
        body = $body
    }

    EFFECT:NEEDS[ResearchBodies]
    {
        name = ResearchBodiesRequirement
        body = @bodies
    }
}
