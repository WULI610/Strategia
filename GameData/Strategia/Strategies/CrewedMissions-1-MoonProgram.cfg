// Strategy for the Mun Program
//   Author: nightingale

STRATEGY_BODY_EXPAND:NEEDS[CustomBarnKit]
{
    author = Nightingale
    name = MoonProgram
    id = MoonProgram

    title = #Loc_Strategies_CrewedMissions_1_MoonProgram_title
    title
    {
        Moon = #Loc_Strategies_CrewedMissions_1_MoonProgram_title_Moon
    }
    desc = #Loc_Strategies_CrewedMissions_1_MoonProgram
    department = Crewed Missions
    icon = Strategia/icons/MunProgram
    icon
    {
        Minmus = Strategia/icons/MinmusProgram
    }

    groupTag = CelestialBodyProgram,A
    
    minLeastDuration = 600
    maxLeastDuration = 600
    minLongestDuration = 1200
    maxLongestDuration = 1600
    
    requiredReputationMin = -1000
    requiredReputationMax = -1000
    
    initialCostFunds = 0.0
    initialCostReputation = 0.0
    initialCostScience = 0.0
    
    hasFactorSlider = False
    factorSliderDefault = 0.10
    factorSliderSteps = 1

    EFFECT
    {
        name = IncompatibleGroupRequirement

        group = CelestialBodyProgram
        text = #Loc_Strategies_CrewedMissions_Incompatible_Text
    }

    EFFECT
    {
        name = CurrencyOperationByBody
        currency = Funds
        operation = Multiply
        
        effectDescription = #Loc_Strategies_CrewedMissions_1_MoonProgram_effectDescription_Body
        
        minValue = 5.00
        maxValue = 5.00	
        
        AffectReasons = Progression

        includeBody = $body
    }

    EFFECT
    {
        name = CurrencyOperationByBody
        currency = Funds
        operation = Multiply
        
        effectDescription = #Loc_Strategies_CrewedMissions_1_MoonProgram_effectDescription_OtherBodies
        
        minValue = 0.20
        maxValue = 0.20	
        
        AffectReasons = Progression

        excludeBody = $body
        excludeBody = $homeWorld
    }

    EFFECT
    {
        name = ContractEffect

        contractType = STG_BodyProgram

        targetBody = $body
        synopsis = #Loc_Strategies_CrewedMissions_1_MoonProgram_synopsis
        completedMessage = #Loc_Strategies_CrewedMissions_1_MoonProgram_completedMessage
        failureMessage = #Loc_Strategies_CrewedMissions_1_MoonProgram_failureMessage

        advanceFunds = 100000.0
        advanceFunds
        {
            Minmus = 75000
            Aptur = 75000
            Serran = 125000
        }
        rewardReputation = 75
        rewardReputation
        {
            Minmus = 50
            Aptur = 50
            Serran = 100
        }

        rewardFunds = 25000
        rewardFunds
        {
            Minmus = 20000
            Aptur = 20000
            Serran = 30000
        }

        failureReputation = 500
        failureFunds = 50000
    }

    EFFECT
    {
        name = ContractWeightBooster
        
        bodies = $body
        weight = 25
    }

    EFFECT
    {
        name = ReturnFromOrbitMannedRequirement
    }

    EFFECT
    {
        name = ReachedBodyMannedRequirement

        invert = true
        body = $body
    }

    EFFECT:NEEDS[ResearchBodies]
    {
        name = ResearchBodiesRequirement
        body = $body
    }
}
